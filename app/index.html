<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nine Arches</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Opening screen: shown before the app's code arrives, dissolved once the app is ready. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        overflow: hidden;
        transition: opacity 0.55s ease, filter 0.55s ease, transform 0.55s ease;
      }
      #splash.done {
        opacity: 0;
        filter: blur(8px);
        transform: scale(1.03);
        pointer-events: none;
      }
      #splash .stage {
        position: relative;
        display: grid;
        place-items: center;
        gap: 26px;
      }
      #splash .burst {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 0;
        height: 0;
      }
      #splash .blob {
        position: absolute;
        left: calc(var(--s) / -2);
        top: calc(var(--s) / -2);
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, var(--c), transparent 68%);
        filter: blur(18px);
        opacity: 0;
        mix-blend-mode: multiply;
        animation: bloom 2.2s cubic-bezier(0.16, 0.9, 0.24, 1) var(--d) forwards;
      }
      #splash .ring {
        position: absolute;
        left: -60px;
        top: -60px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 1.5px solid rgba(70, 143, 240, 0.55);
        opacity: 0;
        animation: ring 1.1s cubic-bezier(0.1, 0.7, 0.3, 1) 80ms forwards;
      }
      #splash .ring.two {
        border-color: rgba(155, 124, 246, 0.4);
        animation-delay: 220ms;
      }
      #splash .spark {
        position: absolute;
        left: -3px;
        top: -3px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--c);
        opacity: 0;
        animation: spark 1.15s cubic-bezier(0.12, 0.8, 0.3, 1) var(--d) forwards;
      }
      #splash svg {
        position: relative;
        width: min(340px, 70vw);
        height: auto;
        overflow: visible;
      }
      #splash .face {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: assemble 0.95s cubic-bezier(0.18, 1.25, 0.32, 1) forwards;
      }
      #splash .face.left {
        --from: translate(-90px, 60px) rotate(-14deg) scale(0.7);
        animation-delay: 260ms;
      }
      #splash .face.top {
        --from: translate(10px, -110px) rotate(10deg) scale(0.7);
        animation-delay: 360ms;
      }
      #splash .face.right {
        --from: translate(100px, 50px) rotate(16deg) scale(0.7);
        animation-delay: 460ms;
      }
      #splash .word {
        clip-path: inset(0 100% 0 0);
        animation: reveal 0.75s cubic-bezier(0.3, 0.7, 0.2, 1) 900ms forwards;
      }
      #splash .line {
        position: relative;
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: #e9eef6;
        overflow: hidden;
        opacity: 0;
        animation: appear 0.4s ease 1.2s forwards;
      }
      #splash .line::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 2px;
        background: linear-gradient(90deg, #4f8ff0, #9b7cf6, #2fc7c0);
        animation: sweep 1.2s ease-in-out infinite;
      }
      @keyframes bloom {
        0% { opacity: 0; transform: translate(0, 0) scale(0.08); }
        35% { opacity: 0.85; transform: translate(var(--dx), var(--dy)) scale(1); }
        100% { opacity: 0.32; transform: translate(calc(var(--dx) * 1.35), calc(var(--dy) * 1.35)) scale(1.45); }
      }
      @keyframes ring {
        0% { opacity: 0.9; transform: scale(0.2); }
        100% { opacity: 0; transform: scale(5.5); }
      }
      @keyframes spark {
        0% { opacity: 0; transform: rotate(var(--a)) translateX(0) scale(1.2); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) scale(0.3); }
      }
      @keyframes assemble {
        0% { opacity: 0; transform: var(--from); }
        60% { opacity: 1; }
        100% { opacity: 1; transform: none; }
      }
      @keyframes reveal {
        to { clip-path: inset(0 0 0 0); }
      }
      @keyframes appear {
        to { opacity: 1; }
      }
      @keyframes sweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .blob { animation: none; opacity: 0.3; transform: translate(var(--dx), var(--dy)); }
        #splash .ring,
        #splash .spark { display: none; }
        #splash .face,
        #splash .word { animation: none; opacity: 1; clip-path: none; }
        #splash .line { animation: none; opacity: 1; }
        #splash .line::after { animation: none; width: 100%; }
      }
    </style>

    <script>
      // The app calls __splashReady() once it has drawn; the screen stays at least long enough to finish its animation.
      (function () {
        var shown = Date.now(), MIN = 1900, gone = false;
        function hide() {
          if (gone) return;
          gone = true;
          var el = document.getElementById("splash");
          if (!el) return;
          el.classList.add("done");
          setTimeout(function () { el.remove(); }, 600);
        }
        window.__splashReady = function () {
          setTimeout(hide, Math.max(0, MIN - (Date.now() - shown)));
        };
        // Never trap anyone behind it if the app fails to start.
        setTimeout(hide, 12000);
      })();
    </script>
